<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Connect - Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Login Page -->
    <div class="container d-flex justify-content-center align-items-center"
         style="min-height: 100vh;">

        <!-- Login Box -->
        <div class="border rounded p-5"
             style="width: 600px; max-width: 100%;">

            <!-- Website Name -->
            <h1 class="text-center fw-bold">
                Food Connect
            </h1>

            <p class="text-center mb-4">
                Find recipes. Plan meals. Build your grocery list.
            </p>

            <!-- Login Form -->
            <!-- Backend will handle authentication -->
            <form method="post" id="loginForm">
                {% csrf_token %}

                <!-- Login Errors -->
                {% if error_message %}
                <div class="alert alert-danger">
                    {{ error_message }}
                </div>
                {% endif %}

                <!-- Email -->
                <div class="mb-3">
                    <input type="email"
                           class="form-control p-3"
                           id="email"
                           name="email"
                           placeholder="Email"
                           autocomplete="email"
                           required>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <input type="password"
                           class="form-control p-3"
                           id="password"
                           name="password"
                           placeholder="Password"
                           autocomplete="current-password"
                           required>
                </div>

                <!-- Login Button -->
                <button type="submit"
                        class="btn text-white w-100 p-3"
                        id="loginBtn"
                        style="background-color: #ff6600;">
                    Log In
                </button>

            </form>

            <!-- OR Divider -->
            <div class="d-flex align-items-center my-4">
                <hr class="flex-grow-1">
                <span class="mx-3">OR</span>
                <hr class="flex-grow-1">
            </div>

            <!-- Create Account Button -->
            <button type="button"
                    class="btn btn-light border w-100 p-3"
                    id="createAccountBtn">
                <strong>Create an Account</strong>
            </button>

            <!-- Forgot Password -->
            <div class="text-center mt-4">
                <button type="button"
                        class="btn btn-link"
                        id="forgotPasswordBtn"
                        style="color: #ff6600; text-decoration: none;">
                    Forgot Password?
                </button>
            </div>

        </div>

    </div>

</body>
</html>
