<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodConnect - Home</title>

  <!-- Bootstrap 5 CSS-->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"> 

</head>
<body>
  
  <!-- FoodConnect Navigation Bar-->
   <nav class="navbar navbar-expand-lg bg-light border-bottom">
    <div class="container-fluid">

      <!--Website Name-->
      <a class="navbar-brand fw-bold" href="home.html">
        Food Connect
      </a>

      <!-- Navigation Links-->
      <div class="navbar-nav">
        <a class="nav-link active" style="border-bottom: 3px solid orange;" href="home.html">Home</a>
        <a class="nav-link" href="recipes.html">Recipes</a>
        <a class="nav-link" href="planner.html">Meal Planner</a>
        <a class="nav-link" href="grocery.html">Grocery List</a>
        <a class="nav-link" href="stores.html">Stores</a>
      </div>

      <!-- Profile Icon -->
      <a href="profile.html" class="ms-auto fs-4 text-dark">
        <i class="bi bi-person-fill"></i>
      </a>
      
    </div>
   </nav>

   <!-- Homepage Content -->
    <div class="container mt-4">
      
      <h1 class="fw-bold">Welcome, User!</h1>

      <!-- Main Feature Cards -->
      <div class="row mt-4">

        <div class="col-md-3">
          <div class="card text-center p-4" style="background-color: #f5f5f5; cursor: pointer;" onclick="window.location.href='recipes.html'">
            <div class="fs-1">
              <i class="bi bi-search"></i>
            </div>
            <p class="mt-2 mb-0">
              Find Recipes
              <i class="bi bi-chevron-right ms-2" style="color: #ff6600;"></i>
            </p>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card text-center p-4" style="background-color: #f5f5f5; cursor: pointer;" onclick="window.location.href='planner.html'">
            <div class="fs-1">
              <i class="bi bi-calendar3"></i>
            </div>
            <p class="mt-2 mb-0">
              Plan Meals
              <i class="bi bi-chevron-right ms-2" style="color: #ff6600;"></i>
            </p>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card text-center p-4" style="background-color: #f5f5f5; cursor: pointer;" onclick="window.location.href='grocery.html'">
            <div class="fs-1">
              <i class="bi bi-list-ul"></i>
            </div>
            <p class="mt-2 mb-0">
              View Grocery List
              <i class="bi bi-chevron-right ms-2" style="color: #ff6600;"></i>
            </p>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card text-center p-4" style="background-color: #f5f5f5; cursor: pointer;" onclick="window.location.href='stores.html'">
            <div class="fs-1">
              <i class="bi bi-geo-alt-fill"></i>
            </div>
            <p class="mt-2 mb-0">
              Find Nearby Stores
              <i class="bi bi-chevron-right ms-2" style="color: #ff6600;"></i>
            </p>
          </div>
        </div>
      </div>

      <!-- Recent Recipes Section -->  
      <h2 class="fw-bold mt-5">Your Recent Recipes</h2>

        <div class="card text-center p-4 mt-3">
          <i class="bi bi-book fs-1"></i>
          <h5 class="mt-3">No recent recipes yet!</h5>
          <p>Start exploring recipes and they'll appear here.</p>
          <div class="text-center">
            <a href="recipes.html" class="btn text-white px-4"
              style="background-color: #ff6600;">
                Find Recipes
            </a>
          </div>  
        </div>
    
      </div>
    
</body>
</html>
