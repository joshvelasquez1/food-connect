<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodConnect - Stores</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"> 
</head>
<body>

  <!-- FoodConnect Navigation Bar -->
  <nav class="navbar navbar-expand-lg bg-light border-bottom">
    <div class="container-fluid">

      <!-- Website Name -->
      <a class="navbar-brand fw-bold" href="home.html">
        Food Connect
      </a>

      <!-- Navigation Links -->
      <div class="navbar-nav">
        <a class="nav-link" href="home.html">Home</a>
        <a class="nav-link" href="recipes.html">Recipes</a>
        <a class="nav-link" href="planner.html">Meal Planner</a>
        <a class="nav-link" href="grocery.html">Grocery List</a>
        <a class="nav-link active" style="border-bottom: 3px solid orange;" href="stores.html">Stores</a>
      </div>

      <!-- Profile Icon -->
      <a href="profile.html" class="ms-auto fs-4 text-dark">
        <i class="bi bi-person-fill"></i>
      </a>

    </div>
  </nav>

  <!-- Page Content -->
  <div class="container mt-4 mb-5">
    
    <h1 class="fw-bold mb-4">Nearby Stores / Price Comparison</h1>

    <div class="row g-4">

      <!-- Left Section: Nearby Stores -->
      <div class="col-md-5">
        <div class="card p-4 border rounded-3 h-100">
          <h2 class="h4 fw-bold mb-1">Nearby Stores</h2>
          <p class="text-secondary mb-4">
            <i class="bi bi-geo-alt-fill me-1"></i> Stores near 12345
          </p>

          <!-- Store Card: Walmart -->
          <div class="card p-3 mb-3 border rounded-3 d-flex flex-row align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
              <div class="bg-light border rounded d-flex align-items-center justify-content-center" style="width: 55px; height: 55px;">
                <i class="bi bi-shop fs-4 text-muted"></i>
              </div>
              <div>
                <h5 class="fw-bold mb-0 fs-6">Walmart</h5>
                <small class="text-muted">1.2 miles</small>
              </div>
            </div>
            <button class="btn btn-sm px-3 fw-bold" style="border: 1px solid #ff6600; color: #ff6600; background-color: transparent;">
              View Prices
            </button>
          </div>

          <!-- Store Card: Target -->
          <div class="card p-3 mb-3 border rounded-3 d-flex flex-row align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
              <div class="bg-light border rounded d-flex align-items-center justify-content-center" style="width: 55px; height: 55px;">
                <i class="bi bi-shop fs-4 text-muted"></i>
              </div>
              <div>
                <h5 class="fw-bold mb-0 fs-6">Target</h5>
                <small class="text-muted">2.4 miles</small>
              </div>
            </div>
            <button class="btn btn-sm px-3 fw-bold" style="border: 1px solid #ff6600; color: #ff6600; background-color: transparent;">
              View Prices
            </button>
          </div>

          <!-- Store Card: Kroger -->
          <div class="card p-3 border rounded-3 d-flex flex-row align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
              <div class="bg-light border rounded d-flex align-items-center justify-content-center" style="width: 55px; height: 55px;">
                <i class="bi bi-shop fs-4 text-muted"></i>
              </div>
              <div>
                <h5 class="fw-bold mb-0 fs-6">Kroger</h5>
                <small class="text-muted">3.1 miles</small>
              </div>
            </div>
            <button class="btn btn-sm px-3 fw-bold" style="border: 1px solid #ff6600; color: #ff6600; background-color: transparent;">
              View Prices
            </button>
          </div>

        </div>
      </div>

      <!-- Right Section: Price Comparison -->
      <div class="col-md-7">
        <div class="card p-4 border rounded-3 h-100">
          <h2 class="h4 fw-bold mb-4">Price Comparison</h2>

          <div class="d-flex flex-column gap-3">

            <!-- Price Item: Chicken Breast -->
            <div class="p-3 border rounded-3 d-flex align-items-center justify-content-between">
              <div class="d-flex align-items-center gap-3">
                <div class="bg-light border rounded d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;">
                  <i class="bi bi-image text-muted"></i>
                </div>
                <span class="fw-bold">Chicken Breast</span>
              </div>
              <div class="d-flex align-items-center gap-4">
                <span class="fw-bold">$5.98</span>
                <span class="text-secondary" style="width: 70px; text-align: right;">Walmart</span>
              </div>
            </div>

            <!-- Price Item: Pasta -->
            <div class="p-3 border rounded-3 d-flex align-items-center justify-content-between">
              <div class="d-flex align-items-center gap-3">
                <div class="bg-light border rounded d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;">
                  <i class="bi bi-image text-muted"></i>
                </div>
                <span class="fw-bold">Pasta</span>
              </div>
              <div class="d-flex align-items-center gap-4">
                <span class="fw-bold">$1.29</span>
                <span class="text-secondary" style="width: 70px; text-align: right;">Target</span>
              </div>
            </div>

            <!-- Price Item: Tomatoes -->
            <div class="p-3 border rounded-3 d-flex align-items-center justify-content-between">
              <div class="d-flex align-items-center gap-3">
                <div class="bg-light border rounded d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;">
                  <i class="bi bi-image text-muted"></i>
                </div>
                <span class="fw-bold">Tomatoes</span>
              </div>
              <div class="d-flex align-items-center gap-4">
                <span class="fw-bold">$2.99</span>
                <span class="text-secondary" style="width: 70px; text-align: right;">Kroger</span>
              </div>
            </div>

            <!-- Price Item: Spinach -->
            <div class="p-3 border rounded-3 d-flex align-items-center justify-content-between">
              <div class="d-flex align-items-center gap-3">
                <div class="bg-light border rounded d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;">
                  <i class="bi bi-image text-muted"></i>
                </div>
                <span class="fw-bold">Spinach</span>
              </div>
              <div class="d-flex align-items-center gap-4">
                <span class="fw-bold">$2.49</span>
                <span class="text-secondary" style="width: 70px; text-align: right;">Walmart</span>
              </div>
            </div>

          </div>

        </div>
      </div>

    </div>

  </div>

</body>
</html>
