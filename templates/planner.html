  <!-- Page Content -->
  <div class="container mt-4 mb-5">
    
    <h1 class="fw-bold mb-3">Weekly Meal Planner</h1>

    <!-- Date Navigation Header -->
    <div class="d-flex align-items-center justify-content-center gap-3 mb-4 fs-5 fw-bold text-dark">
      <button class="btn btn-outline-secondary btn-sm rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
        <i class="bi bi-chevron-left"></i>
      </button>
      <span>October 16 - October 22, 2026</span>
      <button class="btn btn-outline-secondary btn-sm rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">

      </button>
    </div>

              <th scope="col" class="fw-bold fs-5 py-3" style="width: 30%;">Dinner</th>
            </tr>
          </thead>
          <tbody>
            
            <!-- Monday -->
            <tr>
              <td class="fw-bold text-secondary">Mon</td>
              <td><button class="btn btn-light border w-100 py-2 text-muted shadow-sm">+ Add Recipe</button></td>
              <td><button class="btn btn-light border w-100 py-2 text-muted shadow-sm">+ Add Recipe</button></td>
              <td><button class="btn btn-light border w-100 py-2 text-muted shadow-sm">+ Add Recipe</button></td>
            </tr>

            <!-- Tuesday -->
            <tr>

              <td><button class="btn btn-light border w-100 py-2 text-muted shadow-sm">+ Add Recipe</button></td>
            </tr>

              <td><button class="btn btn-light border w-100 py-2 text-muted shadow-sm">+ Add Recipe</button></td>
            </tr>

            <!-- Thursday -->
            <tr>
              <td class="fw-bold text-secondary">Thu</td>
              <td><button class="btn btn-light border w-100 py-2 text-muted shadow-sm">+ Add Recipe</button></td>
              <td><button class="btn btn-light border w-100 py-2 text-muted shadow-sm">+ Add Recipe</button></td>
              <td><button class="btn btn-light border w-100 py-2 text-muted shadow-sm">+ Add Recipe</button></td>
            </tr>

            </tr>
